  - {id: d1, epic: 7, action: 'the plan response schema is not expressible in OpenAI structured outputs, so codex can NEVER compile a plan: z.record emits a type where additionalProperties must be false, discriminated unions emit oneOf which is forbidden, and .optional() leaves a key out of required which is rejected outright. Needs a schema redesign (arrays of pairs, an explicit discriminator field, explicit null) - touches PLAN_SCHEMA_VERSION, the corpus fixtures carrying pre-compiled plans, and an ADR. NOT patchable in the adapter: oneOf->anyOf changes meaning and .optional() has no safe translation', owner: owner, status: open}
  - {id: d2, epic: 7, action: 'generation timeout was sized for the contract role and fired on a 40-criterion plan', owner: owner, status: 'done 2026-09-06 in 103ec20 - DEFAULT_INVOCATION_TIMEOUT_MS 300s -> 900s, above codex-cli.ts''s 600s because this adapter carries the schema in the PROMPT while codex has the API enforce it. 206 provider tests pass; no test pinned the old value. Carried question: there is still no configuration surface for it'}
  - {id: d3, epic: 7, action: 'plan refuses to recompile after new surfaces are declared and says "nothing needs recompiling", which is false: the staleness check reads the contract fingerprint only, while a plan references commandId/serviceId, so declaring an observation genuinely widens what can be planned. Include the declared ids in the check, or narrow the sentence', owner: owner, status: open}
  - {id: d4, epic: 7, action: 'a transient provider probe failure spends all three recorded attempts in ~15s (3 x PROBE_TIMEOUT_MS) with no backoff; claude answered in 15ms immediately afterwards. A retry with no delay cannot recover from the only failure class retries exist for', owner: owner, status: open}
  - {id: d5, epic: 7, action: 'provisionPlaywright is exported and unit-tested but called from NOWHERE in src/, so a browser probe can never provision - structurally the same defect 6.11 closed for setup.install. Two user-facing messages promise provisioning that does not happen', owner: owner, status: 'done 2026-09-07 in story 7.0 - verify calls provisionPlaywright when the compiled plan carries a browser probe, decided from the plan so a gates-only run still spawns nothing. Both promising messages now name verify. Corpus fixture browser-probe-provisions pins that provisioning is attempted, seen red against the pre-change call site; the corpus runner shadows npm/npx so a browser-probe fixture cannot fetch. Carried: nothing in CI drives verify through a REAL provisioning end to end - the nearest is story 6.9''s non-blocking chromium job, which provisions for real but not through verify'}
  - {id: d6, epic: 7, action: 'a browser `visible` read on a selector matching NO element is reported absent, so an assertion of `expected: "false"` -- the standard way a contract says "this element must not be showing" -- fails on the strongest possible evidence that it is not showing. Four critical criteria of gitnebula Epic 6 (E6-10, E6-11, E6-12, E6-14) failed this way at c5a10cb on correct product behaviour; E6-10''s other three assertions passed in the same probe. Mirror image of the defect the no-catch comment at src/surfaces/browser.ts:580-593 prevents: both treat a read that produced no value as a value', owner: owner, status: 'scheduled as story 7.5, spec written 2026-09-09'}
  - {id: d7, epic: 7, action: 'FIRST EVIDENCE-BASED READ ON THE PRODUCT HYPOTHESIS, from the same run. Of 8 failures against a real implementation, ZERO were defects in the shipped product: 4 were the d6 instrument defect, 2 (E6-23, E6-28) a non-recursive findReport in gitnebula''s own probe script, 1 (E6-09) a literal-count probe, and 1 (E6-07) a genuine contract-vs-reality gap -- story 6.3 needed a third direct page.goto because 6.1''s openViewer waits for a handle a FAILED boot never publishes, which nobody could have known when the contract was frozen. The four deterministic gates passed, so the tool did separate "it builds and tests pass" from "the promised behaviour is proven". The cost is precision: on this evidence a first-time contract carries roughly one instrument artifact per two real signals, and needs a calibration pass on a real epic before its FAIL can gate a merge unattended', owner: owner, status: open}
  - {id: d8, epic: 7, action: 'ONBOARDING COST, measured on the only client project. `specwitness init` scaffolds a config that is three lines with comments stripped; gitnebula then required 645 lines of hand-written JavaScript across seven .mjs files before a plan had anything to probe. Five of the seven read only the filesystem -- file existence, phrase presence, pattern counts, hashes -- i.e. logic that is identical in every project and that the PRD''s observation surface (e.g. row counts) never meant to carry. Three of the second run''s eight failures were defects in it. Until this is closed, the path from `npm i -g specwitness` to a first meaningful verdict runs through several hundred lines of bespoke Node, which is the largest barrier to anyone but the author using the package', owner: owner, status: 'answered by ADR-009 2026-09-10; scheduled as story 7.8'}
