# SpecWitness project configuration.
#
# This file is how SpecWitness learns your project. It is also a security
# boundary: ONLY commands declared in this file are ever executed. Nothing an AI
# provider produces can introduce a command — if it is not written here, it does
# not run.
#
# Committed to Git:  config.yaml, contracts/, plans/
# Local-only:        runs/, scorecard.jsonl  (see .specwitness/.gitignore)
#
# Uncomment the sections you need. Everything below `project` is optional, so a
# valid config can stay this short. Run `specwitness doctor` after editing to
# check that what you declared actually resolves on this machine.

version: 1

project:
  # The branch an epic is verified against. Never guessed at verification time.
  # Detected from this repository's HEAD when `specwitness init` ran — change it
  # if that is not the branch you merge into.
  baseBranch: master

  # Optional helper for locating an epic's branch; `--head` always wins over it.
  # epicBranchPattern: "epic/{n}-{slug}"

# Where your planning and implementation artifacts live. The whole block is
# optional; these are the defaults SpecWitness applies when it is absent.
# planning:
#   format: bmad-v6                                  # the only supported format in V0
#   planningArtifacts: docs/planning-artifacts       # PRD, architecture, epics
#   implementationArtifacts: docs/implementation-artifacts  # story files

# One-time preparation run inside the isolated worktree before any gate.
# setup:
#   install: pnpm install

# Deterministic quality gates, run in the order written. The first failure stops
# the run — put the cheapest, fastest gate first. Every `id` must be unique.
# gates:
#   - { id: lint,      run: pnpm lint }
#   - { id: typecheck, run: pnpm typecheck }
#   - { id: unit,      run: pnpm test }
#   - { id: build,     run: pnpm build }

# Long-running processes started for behavioral verification and stopped
# afterwards. `ready` is how SpecWitness knows the service has finished booting:
# give it either a `url` to poll or a `command` to run until it succeeds.
# `timeoutSec` defaults to 60. Declare `port` so `doctor` can warn you when
# something else already holds it.
# services:
#   backend:
#     run: python manage.py runserver 8000
#     port: 8000
#     ready: { url: "http://localhost:8000/health", timeoutSec: 60 }
#     env: { DJANGO_SETTINGS_MODULE: config.settings.test }
#   frontend:
#     run: pnpm dev
#     port: 3000
#     ready: { url: "http://localhost:3000" }

# Commands that put test data into a known state before verification.
# data:
#   reset: ./scripts/reset-test-db.sh

# Commands that measure something about the running system. Each must print a
# single JSON object to stdout; SpecWitness compares before/after values rather
# than trusting a narrative claim that something changed.
# observations:
#   company-count: { run: ./scripts/specwitness/company-count.sh }

# ── Checking files, without writing any code ────────────────────────────────
#
# Many acceptance criteria are facts about the repository itself: a document
# exists, a README mentions something, a package.json script is declared, a
# forbidden spelling is gone from the source. For those you need NOTHING in
# this file — no command and no script. A `file` probe reads the checked-out
# tree directly, runs nothing, and cannot read outside the repository.
#
# File probes live in the PLAN (.specwitness/plans/<epic>.yaml), which
# `specwitness plan <epic>` writes for you. The examples below are what they
# look like, so you can read the plan it wrote, correct a probe, or add one by
# hand: copy one under a criterion's `probes:` list, uncomment it and edit it.
#
#   - id: changelog-records-release
#     surface: file
#     mechanics:
#       path: CHANGELOG.md                  # relative to the repository root
#     assertions:
#       - description: the changelog exists
#         target: { source: exists }        # reads "true" or "false"
#         comparison: equals
#         expected: "true"
#       - description: it records this release
#         target: { source: content }       # the text of ONE file
#         comparison: contains
#         expected: "## 1.2.0"
#
#   - id: design-note-present               # a document ANYWHERE under docs/
#     surface: file
#     mechanics:
#       path: "docs/**/*.md"                # ** = any depth; * and ? within a name
#     assertions:
#       - description: some document covers both the cache and its eviction policy
#         target: { source: filesContaining, texts: [cache, eviction], ignoreCase: true }
#         comparison: greaterThan
#         expected: "0"
#
#   - id: default-tests-stay-fast           # a value inside a JSON file
#     surface: file
#     mechanics:
#       path: package.json
#     assertions:
#       - description: the default test command does not start the browser suite
#         target: { source: jsonPath, path: $.scripts.test }
#         comparison: notContains
#         expected: playwright
#
#   - id: no-hardcoded-handle               # count a literal, ignoring comments
#     surface: file
#     mechanics:
#       path: "src/**/*.ts"
#       exclude: [src/handle.ts, "src/**/*.test.ts"]  # the definition, and the test forbidding it
#     assertions:
#       - description: no source file spells the handle key in code, in any quote style
#         target: { source: occurrences, text: __handle, ignoreComments: c-like }
#         comparison: equals
#         expected: "0"
#
# Count the bare name, never one quoted spelling of it: a census of "__handle"
# passes over '__handle' and `__handle`. Exclude the file that defines the
# name and the test that forbids it, and let ignoreComments drop the rest.
#
# The other read is `fileCount`: how many files a path or glob matched.
#
# When the path is missing, `exists` reads "false" and `fileCount` reads "0" —
# values you can compare. Every other read (`content`, `jsonPath`,
# `occurrences`, `filesContaining`) is simply NOT MET, even with `notContains`
# or `equals "0"`: text that does not exist satisfies nothing. Matching is
# literal, never a regular expression. A file probe tells you what the files
# SAY, not what the software DOES — for behaviour, use an http, browser or
# observation probe.

# Bounded retries per probe class, for environments that are genuinely flaky.
# EVERY SURFACE DEFAULTS TO 0 and the whole block is optional, because a run
# must be deterministic unless you asked otherwise. A probe that fails and then
# passes is reported as a PASS marked `flaky`, with every attempt and its
# evidence recorded — retries change how often something is tried, never what
# the answer means. Maximum 5 per surface; a larger number is rejected rather
# than quietly reduced, so what you wrote is always what you get.
# retries:
#   http: 0
#   browser: 0
#   observation: 0
#   shell: 0
#   file: 0          # reading the tree is deterministic; a retry changes nothing

# Local AI CLIs used to AUTHOR verification artifacts. Verdicts are always
# computed mechanically — no model is ever asked whether your epic passes.
# SpecWitness shells out to CLIs you already have installed and never talks to
# a model API directly.
# ai:
#   providers:
#     claude: { adapter: claude-code-cli, mode: subscription }
#     codex:  { adapter: codex-cli,       mode: chatgpt }
#   roles:
#     # Each role names one of the providers declared above. Assigning the
#     # authoring roles to a different model family than your coding agents is
#     # the point: an independent reader catches what the author missed.
#     contract-author: codex
#     plan-author: codex
#     explainer: claude
