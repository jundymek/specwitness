#
# `--amend` bumps the version, appends the superseded version to history, and
# sets frozen / fingerprint / frozenAt to false / null / null together — then
# stops. The operator edits the criteria and runs `--freeze` separately, so the
# review window stays open and version N+1 cannot end up byte-identical to N.
#
# This file therefore has to parse cleanly: frozen false, fingerprint null,
# frozenAt null, history NON-empty, version >= 2. It is the one shape where
# "draft" and "has been frozen before" are both true, and rejecting it would
# break the only sanctioned way a contract legitimately changes.
