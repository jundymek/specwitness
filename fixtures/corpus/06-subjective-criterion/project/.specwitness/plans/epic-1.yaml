# Hand-written Verification Plan for the corpus fixture
# `06-subjective-criterion`.
#
# PRECOMPILED AND CHECKED IN, which is what makes this fixture AI-free: with a
# plan on disk `verify` compiles nothing, so no provider is ever in scope
# (FR-18, story 6.1 AC1). The `contract.fingerprint` below must match the frozen
# contract beside it; the runner does not patch it, so a contract re-freeze
# means this line is re-copied by hand.
#
# ⚠️ E1-02 IS CARRIED AS `needs-human`, AND IT HAS TO BE. The contract marks it
# `verifiability: human`, and the plan gate refuses any plan that claims
# otherwise — a human criterion planned as `automated` would be claiming a
# machine may decide what its author said no machine may. `reason` must be
# `human-verifiability` and not `not-safely-automatable`: the two are different
# facts with different remedies, and the gate refuses a plan whose reason
# disagrees with its contract. `not-safely-automatable` would tell a reviewer
# that compilation merely failed to map this criterion and that sharpening it
# might help, when in truth no amount of sharpening will change it.
#
# ⚠️ `guidance` IS THE POINT OF THIS FIXTURE, NOT DECORATION. Exit 2 is a STOP,
# and a stop that does not say what to look at is a stop people learn to
# override. `expected.json` pins this exact sentence as it is RENDERED, so
# rewording it here without updating the expectation is caught rather than
# silently absorbed — which is precisely the failure story 5.3 was written to
# close, when guidance the schema required and the plan-author wrote was
# dropped before it ever reached a person.
