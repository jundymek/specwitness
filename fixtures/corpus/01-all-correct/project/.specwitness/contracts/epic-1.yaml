# Hand-written Verification Contract for the corpus fixture `01-all-correct`.
#
# The `spec:` half was written by hand. `meta.frozen`, `meta.fingerprint` and
# `meta.frozenAt` were produced ONCE, at authoring time, by the shipped
# `specwitness contract epic-1 --freeze` — see `fixtures/corpus/README.md`
# § "Adding a fixture". That is deliberate and it is NOT the thing AD-12
# forbids: a contract is an INPUT to the run, and its fingerprint is a hash the
# product must be able to recompute from these bytes or refuse the run.
# `expected.json` — the OUTCOME — is hand-written and never generated.
#
# FOUR criteria across THREE surfaces, on purpose. An all-correct fixture with
# one trivial criterion proves almost nothing: it is the only fixture in the
# corpus that shows SpecWitness does not cry wolf, so it has to exercise the
# stages a defect-class fixture uses rather than the cheapest path to green.
