# Hand-written Verification Contract for the corpus fixture
# `stack-independence-python`.
#
# The `spec:` half was written by hand. `meta.frozen`, `meta.fingerprint` and
# `meta.frozenAt` were produced ONCE, at authoring time, by the shipped
# `specwitness contract epic-1 --freeze` -- see `fixtures/corpus/README.md`
# section "Adding a fixture", step 3. That is deliberate and it is NOT the
# thing AD-12 forbids: a contract is an INPUT to the run, and its fingerprint
# is a hash the product must be able to recompute from these bytes or refuse
# the run. `expected.json` -- the OUTCOME -- is hand-written and never
# generated.
#
# THREE CRITERIA, ONE PER SURFACE, and that is the story's design rather than
# an accident. The acceptance criterion names gates, services AND
# observations; a fixture with a single http probe would have proved that
# HTTP does not care about Node, which nobody doubted.
spec:
  epic: epic-1
  version: 1
  criteria:
    - id: E1-01
      statement: The items endpoint answers 200 and reports the two seeded stock items.
      kind: behavioral
      severity: critical
      verifiability: automated
    - id: E1-02
      statement: The packaged command reports its name and version.
      kind: structural
      severity: normal
      verifiability: automated
    - id: E1-03
      statement: Reserving an item persists exactly one new reservation.
      kind: behavioral
      severity: critical
      verifiability: automated
