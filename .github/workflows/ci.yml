name: CI

# Runs the same six steps every developer runs before a PR. The repository was
# made public on 2026-09-04, so Actions minutes no longer apply; before that the
# triggers were removed by owner decision (2026-08-30) because minutes were
# exhausted and every PR carried a red check that said nothing about the code.
#
# HISTORY WORTH KEEPING: no version of this workflow executed a single step
# until 2026-09-04. The first real run failed in `Enable corepack` on both
# platforms — pnpm 11.24.0 requires Node >=22.13 while this file pinned the
# then-declared engines floor of 22.12. That is what ADR-007 resolved by raising
# the floor to 22.13; the pin below tracks `engines.node` and must keep doing so.
#
# `workflow_dispatch` is retained deliberately so the matrix can be run by hand
# against any branch.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A superseded run proves nothing; let the newer commit take over.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # SpecWitness is a local-first developer tool; both host platforms its
        # users run on are checked. Node is pinned at the engines floor so a
        # feature newer than >=22.13 cannot creep in unnoticed.
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      # Node is selected FIRST. Enabling corepack beforehand would install its
      # shims into the runner's preinstalled Node, and setup-node then puts a
      # different installation ahead of it on PATH — so `pnpm` can go missing.
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13'

      - name: Enable corepack
        # pnpm's version comes from packageManager in package.json, so CI and
        # every developer machine resolve to the same pnpm.
        #
        # Corepack is upgraded first: the release bundled with Node 22.13
        # predates pnpm's current signing key, so activating pnpm@11.24.0 with
        # it can fail with "Cannot find matching keyid". Installing a current
        # corepack sidesteps a failure that would otherwise look like a broken
        # lockfile rather than a stale signature list.
        #
        # `--global corepack@latest` warns EBADENGINE here (current corepack
        # wants a newer Node than our floor) and still installs and works. Pinned
        # deliberately to `@latest` rather than to the floor-compatible release:
        # the signing-key list is the thing we need current.
        run: |
          npm install --global corepack@latest
          corepack enable
          corepack --version
          pnpm --version

      # setup-node's `cache: pnpm` cannot be used here: it resolves the store
      # by running `pnpm` during its own step, which is before corepack has
      # provided it. Caching the store explicitly avoids that ordering trap.
      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Architecture guardrail (AD-1)
        run: pnpm depcruise

      - name: Test
        # `test:ci` is `pnpm test` plus vitest's JSON report, which the next step
        # reads. Same suite, same failures; the extra reporter only writes a file.
        run: pnpm test:ci

      - name: Report skipped suites
        # ⚠️ A GREEN CHECK CAN MEAN LESS THAN IT LOOKS LIKE IT MEANS. Five merged
        # browser suites sit behind `describeWithBrowser`, which calls
        # `describe.skip` when no usable Playwright environment is present —
        # `@playwright/test` is an optional peer and nothing here downloads a
        # browser, so on this runner all five self-skip and the job still passes.
        # That is "green for nothing" (Epic 4 retro §2 observation 2) one level up
        # from a criterion.
        #
        # This step puts the skipped suites, BY NAME AND COUNT, in the job summary
        # rather than in a scrollback nobody opens, and FAILS on a skip that is not
        # one of the enumerated, documented sources — so a new silent skip arrives
        # as an event. Making the browser suites actually RUN is story 6.9's job,
        # in wave 2, as a non-blocking chromium job.
        #
        # `always()`: a failing test run is exactly when the reader most needs to
        # know what did not run at all.
        if: always()
        run: pnpm report:skips

      - name: Build
        run: pnpm build

      - name: Packed-tarball smoke test
        # Proves the published artifact works, not just the working tree:
        # bin mapping, shebang, executable bit, and the exit-code contract.
        run: ./scripts/pack-smoke.sh

  # ─────────────────────────────────────────────────────────────────────────────
  # The Golden Verification Corpus (story 6.1, AC2; SM-5).
  #
  # A SEPARATE JOB rather than one more step in `verify`, and the duplication is
  # deliberate. AC2 requires corpus e2e to be a REQUIRED CHECK, and a check is
  # named after a job: `corpus (ubuntu-latest)` is a line a reviewer and a branch
  # protection rule can both point at, where "the test step inside verify" is not.
  #
  # The corpus ALSO runs inside `pnpm test` in the verify job, on purpose. A
  # developer running `pnpm test` locally must see a fixture drift immediately —
  # a corpus that only runs in its own CI job is a corpus most people never run.
  # The cost is one extra install and one extra ~10s suite per platform.
  #
  # `fixtures/corpus/**` carries HAND-WRITTEN `expected.json` files that are never
  # generated by the code under test (NFR-10, AD-12). When this job goes red the
  # question is which side is wrong — the product changed behaviour, or the
  # expectation was mistaken — and the failure output names the run directory that
  # answers it. There is no command that rewrites an expectation, by design.
  corpus:
    name: corpus (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Both host platforms, and this is the first epic in which the second one
        # is not hypothetical: until 2026-09-04 no CI workflow had executed a
        # single step, so this product's process-group, worktree and signal code
        # had only ever run on macOS. The corpus drives all of it through the real
        # binary, so a Linux-only difference surfaces here first.
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      # Node FIRST, then corepack — see the comments in the `verify` job; both
      # ordering traps recorded there are still live and apply identically here.
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13'

      - name: Enable corepack
        run: |
          npm install --global corepack@latest
          corepack enable
          corepack --version
          pnpm --version

      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Corpus end-to-end (SM-5)
        # `tests/setup/build-cli.ts` builds the binary as vitest's global setup, so
        # this drives the REAL `dist/cli.js` as a subprocess and asserts its process
        # exit code — not an in-process call to a command function.
        run: pnpm test:corpus

  # ─────────────────────────────────────────────────────────────────────────────
  # The browser surface, actually running (story 6.9).
  #
  # ⚠️ WHAT THIS JOB IS FOR. Six merged integration suites depend on a real browser, and on
  # every runner above they DO NOT RUN. Five sit behind `describeWithBrowser`
  # (`tests/integration/surfaces/helpers/browser-fixture.ts:114`) and self-skip; the sixth,
  # `conformance.test.ts`, silently narrows from four surfaces to three (its lines 136-150).
  # The `verify` job's own skipped-suite step reports the first five by name, and on run
  # 33881286844 it reported, on both platforms: 5 files, 10 suites, 42 tests skipped. This job
  # exists to take that number to zero, and it proves it by running the SAME reporter over its
  # own vitest report.
  #
  # ⚠️ NON-BLOCKING, DELIBERATELY, AND WITH A STATED END. `continue-on-error: true` means this
  # job can never fail the workflow run. Browser suites are the most flake-prone thing any CI
  # carries, and a REQUIRED check that goes red for unrelated reasons trains people to ignore
  # red — the precise failure this product's exit-code taxonomy exists to prevent. So it lands
  # amber. Its failures are still loud: every step below writes its verdict into the job
  # summary, so a reader sees what happened without opening a scrollback.
  #
  # The promotion criterion is the PR body's, and flipping it is one line: delete
  # `continue-on-error` and add `browser (ubuntu-latest)` to branch protection. (Verified with
  # `gh api` while writing this: master, the epic branch and the ruleset list all report no
  # protection at all today, so NO check on this repository is enforced.)
  #
  # ⚠️ THIS JOB MAY REACH THE NETWORK. THE CORPUS JOB MAY NOT. That is not an inconsistency:
  # downloading a browser is this job's entire purpose, and story 6.1's corpus AC requires the
  # corpus to be hermetic — zero provider calls, loopback only, a constructed environment. The
  # exception is scoped to the steps below and reaches nothing above it. Two suites, two rules,
  # and they are kept apart on purpose.
  #
  # ⚠️ `ubuntu-latest` ONLY. Linux is where this product's process-group, worktree and signal
  # code had never run before this epic; macOS is where all of it has always run. A macOS
  # browser job would buy a second data point on the platform that already has one, at browser
  # prices.
  browser:
    name: browser (ubuntu-latest)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      # Node FIRST, then corepack — both ordering traps recorded in `verify` are still live
      # and apply identically here.
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13'

      - name: Enable corepack
        run: |
          npm install --global corepack@latest
          corepack enable
          corepack --version
          pnpm --version

      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Read the pinned Playwright version
        id: playwright
        # Keyed on the PIN rather than on `hashFiles('package.json')`, so an unrelated edit to
        # the manifest does not throw away a 150MB download. `tests/unit/infra/playwright-pin.test.ts`
        # keeps this value and `PROVISIONED_PLAYWRIGHT_VERSION` in step, which is what makes
        # the peer dependency a safe thing to key on.
        run: |
          version="$(node -e "console.log(JSON.parse(require('fs').readFileSync('package.json','utf8')).peerDependencies['@playwright/test'])")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "pinned @playwright/test: ${version}"

      - name: Cache the chromium bundle
        id: browser-cache
        uses: actions/cache@v4
        with:
          # Playwright's OWN default registry, mirrored in `src/infra/playwright-env.ts`
          # (`playwrightDefaultBrowsersPath`). This is where the PROJECT route downloads to,
          # and the project route is the one this repository takes.
          #
          # ⚠️ `PLAYWRIGHT_BROWSERS_PATH` is NOT SET, here or anywhere in this job. 5.1's
          # header states it is "input, not authority": setting it would silently change which
          # of the three resolution branches runs, and the job would be proving a path no user
          # takes. The path below is what resolution computes on its own; it is cached, not
          # imposed.
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}

      - name: Record which browser processes are already running
        # The "before" half of AC4. A survival scan is only a statement about THIS RUN if
        # something subtracts what the runner arrived with — see the script's header for the
        # 77-false-positives story that made this a diff rather than a count. Always exits 0:
        # a runner that arrives with a browser up is a fact to record, not this job's failure.
        run: |
          node scripts/browser-leak-check.mjs \
            --browsers-path "$HOME/.cache/ms-playwright" \
            --write-baseline "$RUNNER_TEMP/browser-baseline.txt" \
            --label "before anything ran"

      - name: Provision Playwright through SpecWitness's OWN code
        # ⚠️ THE FIRST TIME `provisionPlaywright` HAS EVER PROVISIONED ANYTHING.
        # `src/cli/doctor/effects.ts:82` records that `doctor` deliberately does not call it,
        # and every other reference in the repository is a unit test with an INJECTED
        # `ProcessRunner`. Epic 5's retro §9 names the gap: "a real browser download —
        # performed by no gate on any platform in this epic". `pnpm provision:browser` runs
        # the real thing, through the real `createProcessRunner`.
        #
        # A separate step, not a `globalSetup`, so its wall-clock is a number the promotion
        # decision can use.
        #
        # The duration is written whether or not provisioning SUCCEEDS. A cold download that
        # times out is precisely the case where its wall-clock is the number somebody needs,
        # and `set -e` would otherwise skip the export and leave the always-run summary saying
        # `n/a` on exactly the failing runs. Status captured, duration written, status returned.
        run: |
          start=$(date +%s)
          pnpm provision:browser || status=$?
          echo "PROVISION_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
          exit ${status:-0}

      - name: Run the browser-dependent suites
        id: suites
        # Same as the step above: a failing suite still reports how long it ran, because the
        # summary is `always()` and a run that lost its timing is a run whose cost nobody can
        # weigh against the promotion criterion.
        run: |
          start=$(date +%s)
          pnpm test:browser || status=$?
          echo "SUITES_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
          exit ${status:-0}

      - name: Prove they RAN rather than skipped
        # ⚠️ THE ACCEPTANCE EVIDENCE, and it is deliberately story 6.1's script UNCHANGED.
        # A green job proves nothing here — a green job is exactly what the defect looked like.
        # What proves it is this reporter answering "SKIPPED: 0 file(s), 0 suite(s)" over a run
        # that collected the browser suites. `always()`: a failing suite is when the reader
        # most needs to know whether it ran at all.
        if: always()
        run: pnpm report:skips:browser

      - name: No browser process survived the run (AC4, normal exit)
        # ⚠️ `--reap` IS NOT OPTIONAL HERE, and leaving it out was a P1 on this branch.
        # This job is non-blocking and every step below is `always()`, so a survivor that was
        # only REPORTED would keep running while the job finished around it — and the
        # cancelled-run check would then record it in its own baseline and subtract it. The
        # job would end having left a browser tree on a shared runner: the exact condition
        # AC4 exists to prevent, produced by the check for it.
        #
        # Reaping happens after the report and does not change the exit code, so a leak that
        # had to be reaped still fails this step.
        if: always()
        #
        # `--owned-under` names this workspace, and it is not decoration: when chromium has
        # exited but its detached `@playwright/test/cli.js` runner has not, that runner's argv
        # carries no browsers-registry path and this step does not know its pgid — so without a
        # third ownership signal it was reported and left running, and the cancelled-run check's
        # fresh baseline then swallowed it. Reported-then-hidden is worse than reported. The
        # runner's argv does carry its `cliPath`, which lives under the checkout.
        run: |
          node scripts/browser-leak-check.mjs \
            --browsers-path "$HOME/.cache/ms-playwright" \
            --owned-under "$GITHUB_WORKSPACE" \
            --baseline "$RUNNER_TEMP/browser-baseline.txt" \
            --wait-seconds 30 \
            --reap \
            --label "after the suites finished normally"

      - name: No browser process survived a CANCELLED run (AC4, SIGKILL)
        # ⚠️ THE CASE THAT ACTUALLY LEAKS. `concurrency.cancel-in-progress` above means every
        # superseded push kills a browser run mid-flight on a SHARED runner, and Epic 4 retro
        # §2 observation 8 records that a killed run executes no `afterEach` at all — so every
        # self-limiting fixture in `browser-fixture.ts` is irrelevant in exactly this case.
        # The script kills the runner's process GROUP and deliberately spares anything
        # `ProcessRunner` detached into its own, which is what a cancellation leaves behind.
        if: always()
        env:
          WAIT_SECONDS: '180'
        run: |
          BROWSERS_PATH="$HOME/.cache/ms-playwright" bash scripts/browser-cancelled-run-check.sh

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Browser job — timings and cache"
            echo ""
            echo "| what | value |"
            echo "| --- | --- |"
            echo "| chromium cache | ${{ steps.browser-cache.outputs.cache-hit == 'true' && 'HIT' || 'MISS (cold)' }} |"
            echo "| pinned @playwright/test | ${{ steps.playwright.outputs.version }} |"
            echo "| provisioning | ${PROVISION_SECONDS:-n/a}s |"
            echo "| the six suites | ${SUITES_SECONDS:-n/a}s |"
            echo ""
            echo "This job is **non-blocking** (\`continue-on-error: true\`). A green workflow"
            echo "run does **not** mean the browser suites passed — read the steps above."
          } >> "$GITHUB_STEP_SUMMARY"
