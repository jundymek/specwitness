name: CI

# TEMPORARILY DISABLED — 2026-08-30, owner decision.
#
# This repository is private and its GitHub Actions minutes are exhausted, so
# every job is rejected before it starts ("recent account payments have failed
# or your spending limit needs to be increased") and zero steps execute. That
# left a red, meaningless check on every PR in the epic — which trains
# reviewers to ignore CI and would hide a genuine failure when one appears.
#
# Only the triggers were removed; the job below still does the full check and
# can be started by hand from the Actions tab (workflow_dispatch).
#
# HONEST CAVEAT: because minutes are exhausted, no version of this workflow has
# ever executed a single step. The steps mirror what is run locally before every
# PR and the bootstrap order has been reviewed, but treat the first real run as
# unproven and expect to iterate on it.
#
# TO RE-ENABLE once minutes are available, restore these three lines above
# workflow_dispatch:
#   push:
#     branches: [master]
#   pull_request:
#
# Until then the same six steps are run locally before every PR:
#   pnpm install --frozen-lockfile && pnpm typecheck && pnpm depcruise \
#     && pnpm test && pnpm build && ./scripts/pack-smoke.sh
on:
  workflow_dispatch:

# A superseded run proves nothing; let the newer commit take over.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # SpecWitness is a local-first developer tool; both host platforms its
        # users run on are checked. Node is pinned at the engines floor so a
        # feature newer than >=22.12 cannot creep in unnoticed.
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      # Node is selected FIRST. Enabling corepack beforehand would install its
      # shims into the runner's preinstalled Node, and setup-node then puts a
      # different installation ahead of it on PATH — so `pnpm` can go missing.
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12'

      - name: Enable corepack
        # pnpm's version comes from packageManager in package.json, so CI and
        # every developer machine resolve to the same pnpm.
        run: corepack enable

      # setup-node's `cache: pnpm` cannot be used here: it resolves the store
      # by running `pnpm` during its own step, which is before corepack has
      # provided it. Caching the store explicitly avoids that ordering trap.
      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Architecture guardrail (AD-1)
        run: pnpm depcruise

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Packed-tarball smoke test
        # Proves the published artifact works, not just the working tree:
        # bin mapping, shebang, executable bit, and the exit-code contract.
        run: ./scripts/pack-smoke.sh
